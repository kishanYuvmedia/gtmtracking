# Optional — only needed if you don't have MongoDB + Redis installed locally.
# If you have both running natively, ignore this file and use backend/.env directly.
#
# Quick start with Docker:
#   docker compose up -d mongo redis
#   cd backend && npm install && npm run dev

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
